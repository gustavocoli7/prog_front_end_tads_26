<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Acesse os projetos desenvolvidos na disciplina de Programação Front-end."
    />
    <title>Projetos | TADS Front-end</title>
    <link rel="icon" href="tecboard/favicon-tecboard-roxo.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "Poppins";
        src: url("tecboard/fonts/Poppins-Bold.ttf") format("truetype");
        font-weight: 700;
        font-display: swap;
      }

      @font-face {
        font-family: "Roboto";
        src: url("tecboard/fonts/Roboto-Bold.ttf") format("truetype");
        font-weight: 400 700;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        font-family: "Roboto", Arial, sans-serif;
        color: #fff;
        background: hsl(165, 45%, 15%);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 82% 32%, rgb(151 71 255 / 14%), transparent 34rem),
          hsl(165, 45%, 15%);
      }

      .page {
        width: min(1120px, calc(100% - 48px));
        margin: 0 auto;
      }

      header {
        padding: 32px 0;
        border-bottom: 1px solid rgb(255 255 255 / 12%);
      }

      .logo {
        display: block;
        width: 176px;
        height: auto;
      }

      main {
        padding: 64px 0 80px;
      }

      .intro {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 48px;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #c9a5ff;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1,
      h2 {
        font-family: "Poppins", sans-serif;
      }

      h1 {
        max-width: 560px;
        margin: 0;
        font-size: clamp(40px, 6vw, 64px);
        line-height: 1.12;
      }

      h1 span {
        color: #9747ff;
      }

      .intro-copy {
        max-width: 460px;
        margin: 20px 0 0;
        color: #d3dedb;
        font-size: 18px;
        line-height: 1.6;
      }

      .showcase {
        display: block;
        width: 100%;
        height: auto;
      }

      .projects {
        margin-top: 40px;
      }

      .projects h2 {
        margin: 0 0 20px;
        font-size: 26px;
      }

      .project-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
        gap: 16px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .project-link {
        display: flex;
        min-height: 112px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 24px;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 16px;
        background: rgb(0 0 0 / 18%);
        color: inherit;
        text-decoration: none;
        transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
      }

      .project-link:hover {
        transform: translateY(-2px);
        border-color: #9747ff;
        background: rgb(151 71 255 / 12%);
      }

      .project-link:focus-visible {
        outline: 3px solid #c9a5ff;
        outline-offset: 4px;
      }

      .project-name {
        font-family: "Poppins", sans-serif;
        font-size: 20px;
      }

      .project-action {
        color: #c9a5ff;
        font-size: 14px;
        white-space: nowrap;
      }

      footer {
        padding: 20px 0 32px;
        border-top: 1px solid rgb(255 255 255 / 12%);
        color: #b7c5c1;
        font-size: 14px;
      }

      @media (max-width: 700px) {
        .page {
          width: min(100% - 32px, 520px);
        }

        header {
          padding: 24px 0;
        }

        .logo {
          width: 148px;
        }

        main {
          padding: 40px 0 56px;
        }

        .intro {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        h1 {
          font-size: clamp(40px, 12vw, 56px);
        }

        .intro-copy {
          margin-top: 16px;
          font-size: 16px;
        }

        .showcase {
          width: min(100%, 420px);
          margin: 0 auto;
        }

        .projects {
          margin-top: 28px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="page">
        <a href="./" aria-label="Página inicial dos projetos">
          <img
            class="logo"
            src="tecboard/img/logo-tecboard-branco.png"
            alt="Tecboard"
          />
        </a>
      </div>
    </header>

    <main class="page">
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">TADS · Programação Front-end</p>
          <h1 id="page-title"><span>Projetos</span> que ganham vida na web</h1>
          <p class="intro-copy">
            Explore os projetos desenvolvidos durante a disciplina. Novos trabalhos serão
            adicionados aqui ao longo do semestre.
          </p>
        </div>
        <picture>
          <source
            media="(max-width: 700px)"
            srcset="tecboard/img/celulares-sobrepostos-mobile.png"
          />
          <img
            class="showcase"
            src="tecboard/img/celulares-sobrespostos-desktop.png"
            alt="Dois celulares exibindo páginas do Tecboard, sobre um brilho roxo."
          />
        </picture>
      </section>

      <section class="projects" aria-labelledby="projects-title">
        <h2 id="projects-title">Projetos disponíveis</h2>
        <ul class="project-list">
          <li>
            <a class="project-link" href="tecboard/index.html">
              <span class="project-name">Tecboard</span>
              <span class="project-action">Acessar projeto <span aria-hidden="true">→</span></span>
            </a>
          </li>
        </ul>
      </section>
    </main>

    <footer>
      <div class="page">TADS · 2026</div>
    </footer>
  </body>
</html>
